<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lift flowers out of photos and arrange them in a shallow ikebana bowl of rippling water.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Camera Roll Ikebana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a camera roll on the left (photos you pick flowers out of), a white florist's stage on the right; stacked on phones. Single light look by design: the stage is plain white. */
:root{
  --paper:#ffffff;
  --roll:#f2f1f4;
  --ink:#1e1a21;
  --muted:#7b7482;
  --line:#e3e0e7;
  --plum:#5b2444;
  --plum-soft:#f3e9ef;
  --kraft:#a8784b;
  --display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-columns:minmax(320px,40%) 1fr}

/* ---------- camera roll: a 3D coverflow ring ---------- */
.roll{position:relative;background:var(--roll);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;padding-block:18px 18px;overflow:hidden}
.viewer{position:relative;flex:1;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none;perspective:1000px;perspective-origin:50% 45%;cursor:grab}
.viewer.dragging{cursor:grabbing}
.ring{position:absolute;inset:0;transform-style:preserve-3d}
.slide{position:absolute;left:50%;top:50%;border-radius:0;background:#ddd;will-change:transform;overflow:hidden;
  box-shadow:0 1px 2px rgba(30,20,35,.1),0 18px 40px -18px rgba(30,20,35,.45);
  -webkit-box-reflect:below 4px linear-gradient(transparent 90%,rgba(255,255,255,.2))}
.slide .clip{position:absolute;inset:0;border-radius:8px;overflow:hidden}
.slide .shade{position:absolute;inset:0;background:#2a2230;opacity:var(--shade,0);pointer-events:none}
.slide img.photo{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;transition:filter .35s ease}
.viewer.lifting .slide.current img.photo{filter:brightness(.8) saturate(.82)}
.ghost{position:absolute;pointer-events:none;opacity:0;filter:brightness(0) blur(7px);transition:opacity .3s ease}
.viewer.lifting .ghost.on{opacity:.32}
.hover-glint{position:absolute;pointer-events:none;opacity:0;transition:opacity .2s ease;
  filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 0 6px rgba(255,255,255,.6)) brightness(1.06)}
.hover-glint.on{opacity:1}
.dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:0;background:transparent;cursor:grab;padding:0;transition:opacity .3s}
.dot::before,.dot::after{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.95);box-shadow:0 0 6px rgba(0,0,0,.25)}
.dot::after{inset:3px;border-color:rgba(255,255,255,.55);animation:breathe 3.2s ease-in-out infinite}
.slide:not(.current) .dot,.viewer.moving .dot{opacity:0;pointer-events:none}
.viewer.lifting .dot{opacity:0}
.dot:focus-visible{outline:2px solid #fff;outline-offset:2px}
@keyframes breathe{0%,100%{transform:scale(.75);opacity:.2}50%{transform:scale(1.15);opacity:.9}}
.thumbs{display:flex;gap:4px;justify-content:center;align-items:center;position:absolute;left:0;right:0;z-index:200;padding:4px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));flex:0 0 auto}
.thumb{width:30px;height:40px;border:0;padding:0;border-radius:4px;overflow:hidden;cursor:pointer;opacity:.55;transition:width .35s ease,height .35s ease,opacity .3s ease;background:#ccc}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.on{width:48px;height:48px;opacity:1;box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.thumb:focus-visible{outline:2px solid var(--plum);outline-offset:2px}

/* ---------- stage ---------- */
.stage{position:relative;min-width:0;min-height:0;background:var(--paper);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.turning{cursor:grabbing}
.empty{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(300px,70%);aspect-ratio:3/4;border:0;border-radius:50% 50% 46% 46%/42% 42% 58% 58%;
  display:grid;place-items:center;text-align:center;pointer-events:none;transition:opacity .5s ease,transform .5s ease}
.toolbar{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;align-items:center;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 10px 30px -14px rgba(40,20,40,.35);max-width:calc(100% - 32px)}
.btn{border:0;border-radius:999px;height:38px;padding:0 16px;font-size:13px;font-weight:500;cursor:pointer;background:transparent;white-space:nowrap}
.btn:hover:not(:disabled){background:#f4f2f5}
.btn:disabled{opacity:.38;cursor:default}
.btn.primary{background:var(--plum);color:#fff;padding:0 20px}
.btn.icon{width:42px;padding:0;display:grid;place-items:center}
.btn.primary.icon{width:58px}
.btn.primary:hover:not(:disabled){background:#4a1c37}
.empty.hide{opacity:0;transform:translate(-50%,-50%) scale(.96)}
.empty.ready{background:radial-gradient(closest-side,rgba(91,36,68,.05),transparent)}
.loading{position:absolute;inset:0;background:var(--paper);transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}

/* ---------- the lifted flower ---------- */
.lift{position:fixed;left:0;top:0;z-index:50;pointer-events:none;will-change:transform;
  filter:drop-shadow(0 0 1.2px rgba(255,255,255,1)) drop-shadow(0 0 1px rgba(255,255,255,1)) drop-shadow(0 16px 18px rgba(40,20,40,.28)) drop-shadow(0 3px 4px rgba(40,20,40,.18))}
.lift img{width:100%;height:100%;display:block}
.lift .shim{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%) no-repeat;background-size:260% 100%;background-position:120% 0;mix-blend-mode:soft-light;opacity:.95}
.lift .shim.run{animation:sweep 1.05s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes sweep{from{background-position:120% 0}to{background-position:-30% 0}}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,60%) minmax(0,40%)}
  .stage{order:1}
  .roll{order:2;border-right:0;border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
  .toolbar{bottom:14px}
  .thumbs{padding-top:2px}.thumb{height:30px;width:22px}.thumb.on{width:36px;height:36px}
  .btn{height:36px}.btn.icon{width:38px}.btn.primary.icon{width:52px}
}
@media (prefers-reduced-motion:reduce){
  .dot::after{animation:none}
  .lift .shim.run{animation:none}
}
</style>

</div>

canvas.addEventListener('pointerup',endTurn); canvas.addEventListener('pointercancel',endTurn);
canvas.tabIndex=0;
canvas.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'){ yawVel-=2.2; e.preventDefault(); } if(e.key==='ArrowRight'){ yawVel+=2.2; e.preventDefault(); } if(e.key==='ArrowUp'){ pitch=clamp(pitch-.08,-.45,.6); } if(e.key==='ArrowDown'){ pitch=clamp(pitch+.08,-.45,.6); } });

/* ================= UI ================= */
let yawGoal=null, pitchGoal=null;
function refreshUI(){
  const n=flowers.filter(f=>!f.out).length;
  $('empty').classList.toggle('hide', n>0);
  $('undoBtn').disabled = !n; $('resetBtn').disabled = !n;
}
$('undoBtn').onclick=()=>{ const f=[...flowers].reverse().find(f=>f.out===0); if(!f) return; f.out=.0001; refreshUI(); };
$('resetBtn').onclick=()=>{ flowers.forEach((f,i)=>{ if(!f.out) f.out=.0001 - i*.06; }); refreshUI(); };
function quickAdd(def, from){
  if(!ready) return;
  if(state!=='build'){ toast('Unwrap the bouquet to add more stems'); return; }
  const s=slides[cur]; const r=flowerRect(s,def);
  lift={def, slide:s, el:null}; // placeholder to reuse helpers
  const el=document.createElement('div'); el.className='lift'; const im=document.createElement('img'); im.src=imgs[def.key].src; im.alt=''; el.appendChild(im);
  el.style.width=r.width+'px'; el.style.height=r.height+'px'; document.body.appendChild(el);
  Object.assign(lift,{el, w:r.width, h:r.height, ox:r.width/2, oy:r.height/2, px:r.left+r.width/2, py:r.top+r.height/2, rot:0, s:1, phase:'drop', tw:null});
  placeOver(s.ghost,s,def); s.ghost.classList.add('on'); viewer.classList.add('lifting'); 
  dropLift(autoPlacement());
}

/* ================= main loop ================= */
let clock=0, last=performance.now(), ready=false;
function loop(now){
  const dt=Math.min((now-last)/1000, 1/30); last=now; clock+=dt;
  // carousel spring
  renderRoll(dt);
  updateLift(dt);
  // bouquet rotation: inertia, idle breathing, auto-face for wrapping
  if(!turning){
    if(yawGoal!=null){ yawVel = lerp(yawVel,(yawGoal-yaw)*4,.15); if(Math.abs(yawGoal-yaw)<.002){ yaw=yawGoal; yawGoal=null; yawVel=0; } }
    else yawVel *= Math.exp(-2.2*dt);
    yaw += yawVel*dt;
    const pg = pitchGoal ?? .06; pitch = lerp(pitch, pg, 1-Math.exp(-.8*dt));
  }
  const idle = Math.sin(clock*.23)*.035;
  bouquet.rotation.y = yaw + idle; tilt.rotation.x = pitch;
  bouquet.position.y = Math.sin(clock*.8)*.012;
  // angular velocity / acceleration in the bouquet's frame
  const yr=(bouquet.rotation.y-prevYaw)/dt, pr=(pitch-prevPitch)/dt; prevYaw=bouquet.rotation.y; prevPitch=pitch;
  const by=bouquet.rotation.y;
  const om=V(pr*Math.cos(by), yr, pr*Math.sin(by));
  omega.lerp(om,.5); alphaA.lerp(_v.copy(omega).sub(omegaPrev).divideScalar(dt),.3); omegaPrev.copy(omega);
  if(alphaA.length()>60) alphaA.setLength(60);
  // gusts of breeze
  if(clock>nextGust){ gustTarget = .5+Math.random()*.6; nextGust = clock + 7+Math.random()*8; setTimeout(()=>gustTarget=0, 1200+Math.random()*900); }
  gust = lerp(gust,gustTarget,1-Math.exp(-1.6*dt));
  // flowers
  for(let i=flowers.length-1;i>=0;i--){ const f=flowers[i];
    if(f.out!==0){ f.out=Math.min(1,f.out+dt*2.2); if(f.out>=1){ disposeFlower(f); flowers.splice(i,1); if(!flowers.length) kzCount=0; updateDome(); refreshUI(); continue; } }
    // sub-stepped springs keep stiff stems stable
    for(let s=0;s<2;s++) stepPhysics(f,dt/2,clock);
    updateFlower(f,dt);
  }
  updateWater(dt,clock);
  // motes
  for(let i=0;i<MOTES;i++){ const m=moteSeed[i]; m.y += m.s*dt*(1+gust*2); m.a += dt*(.05+gust*.3)/m.r; if(m.y>3.4) m.y=-1.6;
    moteP[i*3]=Math.sin(m.a)*m.r + Math.sin(clock*.5+m.ph)*.08; moteP[i*3+1]=m.y; moteP[i*3+2]=Math.cos(m.a)*m.r; }
  moteGeo.attributes.position.needsUpdate=true; motes.material.opacity = .35+.2*Math.sin(clock*.7);
  for(let i=bursts.length-1;i>=0;i--){ const b=bursts[i]; b.t+=dt; const P=b.pts.geometry.attributes.position;
    for(let j=0;j<b.vel.length;j++){ if(b.floorY>-99 && P.array[j*3+1]<b.floorY && b.vel[j].y<0){ if(!b.vel[j].hit){ b.vel[j].hit=1; disturb(P.array[j*3],P.array[j*3+2],.03,-.003); } b.vel[j].set(0,0,0); continue; } b.vel[j].y-=dt*b.g; b.vel[j].multiplyScalar(.97); P.array[j*3]+=b.vel[j].x*dt; P.array[j*3+1]+=b.vel[j].y*dt; P.array[j*3+2]+=b.vel[j].z*dt; }
    P.needsUpdate=true; b.pts.material.opacity=Math.max(0,.9*(1-b.t/1.4))*(b.floorY>-99?.8:1); if(b.t>1.4){ bouquet.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(i,1); } }
  // petals
  if(clock>nextPetal && !reduceMotion){ nextPetal=clock+9+Math.random()*10; dropPetal(); }
  for(let i=petals.length-1;i>=0;i--){ const p=petals[i], M=p.m; p.t+=dt;
    if(p.float){
      // afloat: carried on the surface, bobbing with the ripples, nudged by the breeze, kept off the wall
      p.v.x += (Math.sin(clock*.3+p.ph)*.004 + gust*.01*Math.cos(p.ph))*dt; p.v.z += Math.cos(clock*.27+p.ph)*.004*dt; p.v.multiplyScalar(Math.exp(-.4*dt));
      M.position.x += p.v.x*dt; M.position.z += p.v.z*dt;
      if(!inWater(M.position.x,M.position.z,.93)){ const a=Math.atan2(M.position.z,M.position.x); const r=rW(a)*.93; M.position.x=Math.cos(a)*r; M.position.z=Math.sin(a)*r; p.v.multiplyScalar(-.5); }
      const e=SIM.dx, x=M.position.x, z=M.position.z;
      M.position.y = WATER_Y + heightAt(x,z) + .004;
      const gx=(heightAt(x+e,z)-heightAt(x-e,z))/(2*e), gz=(heightAt(x,z+e)-heightAt(x,z-e))/(2*e);
      p.spinY += p.spin.y*.05*dt; M.rotation.set(-Math.PI/2 + gz*1.5, 0, p.spinY); M.rotation.y = -gx*1.5;
      M.material.opacity = clamp((40-p.t)/4,0,1);
      if(p.t>40){ bouquet.remove(M); M.material.dispose(); petals.splice(i,1); }
      continue;
    }
    p.v.y=Math.max(p.v.y-dt*.25,-.32); M.position.x+= (p.v.x+Math.sin(p.t*2.2+p.ph)*.18)*dt; M.position.y+=p.v.y*dt; M.position.z+=(p.v.z+Math.cos(p.t*1.7+p.ph)*.12)*dt;
    M.rotation.x+=p.spin.x*dt; M.rotation.y+=p.spin.y*dt; M.rotation.z+=p.spin.z*dt*.5;
    M.material.opacity = clamp(p.t*3,0,1)*(p.landed? clamp(1-(p.t-p.landed)/1.5,0,1) : 1);
    if(M.position.y<=WATER_Y+.004 && !p.landed && inWater(M.position.x,M.position.z,.9)){
      p.float=true; p.t=0; p.spinY=M.rotation.z; p.v.set(p.v.x*.15,0,p.v.z*.15); disturb(M.position.x,M.position.z,.05,-.006); M.material.opacity=1;
      if(petals.filter(q=>q.float).length>10){ const old=petals.find(q=>q.float&&q!==p); if(old) old.t=Math.max(old.t,36); }
      continue; }
    if(M.position.y<BOWL_Y+.01){ M.position.y=BOWL_Y+.01; p.v.set(0,0,0); p.spin.set(0,0,0); if(!p.landed) p.landed=p.t; }
    if(p.landed && p.t-p.landed>1.5){ bouquet.remove(M); M.material.dispose(); petals.splice(i,1); } }
  // drop target ring
  ringA = lerp(ringA, ringTarget, 1-Math.exp(-10*dt));
  if(hoverPoint){ ring.position.copy(hoverPoint); ringInner.position.copy(hoverPoint); }
  ring.quaternion.copy(bouquet.quaternion).premultiply(tilt.quaternion).invert().multiply(camera.quaternion); ringInner.quaternion.copy(ring.quaternion);
  const pulse=1+.12*Math.sin(clock*5); ring.scale.setScalar(pulse); ringInner.scale.setScalar(pulse*.92);
  kzRing.material.opacity=ringA*(.35+.15*Math.sin(clock*5)); kzRing.visible=ringA>.01;
  ring.material.opacity=ringA*.6; ringInner.material.opacity=ringA*.07; ring.visible=ringInner.visible=ringA>.01;
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

/* ================= boot ================= */
go(0);
Promise.all(FL.map(async f=>{
  const im=await loadImg(`cuts/${f.key}.webp`); imgs[f.key]=im;
  const [c,g]=cnv(im.naturalWidth,im.naturalHeight); g.drawImage(im,0,0); const d=g.getImageData(0,0,c.width,c.height);
  alpha[f.key]={w:c.width,h:c.height,data:d.data};
  let r=0,gg=0,b=0,n=0; for(let i=0;i<d.data.length;i+=16){ if(d.data[i+3]>200){ r+=d.data[i]; gg+=d.data[i+1]; b+=d.data[i+2]; n++; } }
  avg[f.key]=new THREE.Color().setRGB(r/n/255,gg/n/255,b/n/255).convertSRGBToLinear();
})).then(()=>{ ready=true; $('loading').classList.add('done'); }).catch(()=>{ $('loading').textContent='Some flowers didn’t load. Reload the page to try again.'; });
resize(); refreshUI();
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(loop); });
})();
</script>
