<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="A still life of porcelain, stoneware and coloured glass to break with a hammer, piece by piece.">
<title>Still Life, Broken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--ink:#1d1b1a;--muted:#8d8780;--paper:#ffffff;--display:"Instrument Serif","Iowan Old Style",Georgia,serif;--ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
.ui{position:fixed;z-index:2;pointer-events:none}
.title{top:max(22px,env(safe-area-inset-top));left:28px}
.title h1{margin:0;font:400 30px/1 var(--display);letter-spacing:-.01em}
.title h1 i{color:#6b6560}
.title p{margin:7px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tools{top:max(22px,env(safe-area-inset-top));right:22px;display:flex;gap:4px;pointer-events:auto}
.tools button{font:500 11px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,.72);border:0;padding:10px 12px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .2s,color .2s}
.tools button:hover{background:#f3f1ee}
.tools button:focus-visible{outline:2px solid #22409b;outline-offset:2px}
.tools button[aria-pressed="false"]{color:var(--muted)}
.hint{left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);font:italic 400 19px/1.2 var(--display);color:#77716b;text-align:center;transition:opacity 1.2s ease;white-space:nowrap}
.count{right:28px;bottom:max(24px,env(safe-area-inset-bottom));font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;transition:opacity .6s}
.count b{font:400 22px/1 var(--display);letter-spacing:0;color:var(--ink);margin-right:6px;vertical-align:-2px}
@media (max-width:640px){
  .title{left:18px}.title h1{font-size:25px}.title p{font-size:10px}
  .tools{right:12px;top:auto;bottom:max(14px,env(safe-area-inset-bottom))}
  .tools button{padding:9px 10px;font-size:10px}
  .hint{bottom:auto;top:calc(max(22px,env(safe-area-inset-top)) + 58px);left:18px;transform:none;font-size:16px}
  .count{right:auto;left:18px;bottom:max(18px,env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<canvas id="c" aria-label="A still life of plates, bowls, a mug, a vase, a bottle and glasses. Click or tap to break them." role="img"></canvas>
<div class="ui title"><h1>Still life, <i>broken</i></h1><p>Porcelain · stoneware · glass</p></div>
<div class="ui tools">
  <button id="sound" aria-pressed="true">Sound</button>
  <button id="keep">Keep</button>
  <button id="reset">New table</button>
</div>
<div class="ui hint" id="hint">Click to break. Click the pieces to break them smaller.</div>
<div class="ui count" id="count" style="opacity:0"><b id="n">0</b> pieces</div>
<script>
'use strict';
/* =========================================================================
   Still life, broken.
   Everything is painted procedurally on canvas: a 3/4 view of a white table.
   Horizontal surfaces are foreshortened by K. Objects are pre-rendered
   sprites; shattering is a Voronoi fracture of the sprite, and the pieces
   live in 2.5D (ground x/y + height z) until they settle and are baked into

const K = 0.46, TAU = Math.PI * 2;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);

const lerp = (a, b, t) => a + (b - a) * t;

const pick = a => a[(Math.random() * a.length) | 0];
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function rgb(hex) { hex = hex.replace('#', ''); const n = parseInt(hex, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(hex, a) { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; }

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let P = Math.min(2, window.devicePixelRatio || 1);
let W = 0, H = 0, S = 1, offX = 0, offY = 0;

/* ---------------------------------------------------------------- profiles */
function prof(pts) {

    if (h <= pts[0][0]) return pts[0][1];

function lathePath(g, R, h0, h1, sc, top = true) {

  matte: mkStrip([[0, 'rgba(0,0,0,.20)'], [.08, 'rgba(0,0,0,.06)'], [.28, 'rgba(255,255,255,.10)'], [.5, 'rgba(0,0,0,0)'], [.82, 'rgba(0,0,0,.12)'], [.96, 'rgba(0,0,0,.2)'], [1, 'rgba(0,0,0,.14)']]),
  mspec: mkStrip([[0, 'rgba(255,255,255,0)'], [.12, 'rgba(255,255,255,0)'], [.27, 'rgba(255,255,255,.28)'], [.44, 'rgba(255,255,255,0)']]),
  gspec: mkStrip([[0, 'rgba(255,255,255,0)'], [.12, 'rgba(255,255,255,0)'], [.135, 'rgba(255,255,255,.95)'], [.17, 'rgba(255,255,255,.9)'], [.185, 'rgba(255,255,255,0)'], [.23, 'rgba(255,255,255,0)'], [.25, 'rgba(255,255,255,.4)'], [.275, 'rgba(255,255,255,0)'], [.79, 'rgba(255,255,255,0)'], [.85, 'rgba(255,255,255,.5)'], [.9, 'rgba(255,255,255,0)']]),

const glassStrips = {};

function motifAt(g, R, u, h, sc, fn) {

/* --------------------------------------------------- botanical ink painting */

/* ------------------------------------------------------------------ juice */
let freezeT = 0, slowT = 0, slowDur = 1, slowMin = 1, shakeA = 0, zoomA = 0, zoomX = 0, zoomY = 0;
function juice(freeze, smin, sdur, shake, zoom, x, y) {
  freezeT = Math.max(freezeT, freeze);
  if (smin < 1) { slowMin = Math.min(slowT > 0 ? slowMin : 1, smin); slowT = sdur; slowDur = sdur; }
  shakeA = Math.max(shakeA, shake * S); zoomA = Math.max(zoomA, zoom); zoomX = x + offX; zoomY = y + offY;
}

/* -------------------------------------------------------------- smashing */
function hitObject(sx, sy) {
  const order = objs.filter(o => !o.broken && o.appear >= .6).sort((a, b) => (a.flat - b.flat) || (b.y - a.y));
  for (const o of order) {
    const u = Math.round((sx - o.x) * P + o.ax), v = Math.round((sy - o.y) / o.F0 * P + o.ay);
    if (u < 0 || v < 0 || u >= o.sprite.width || v >= o.sprite.height) continue;
    if (o.data[(v * o.sprite.width + u) * 4 + 3] > 24) return o;
  }
  return null;
}
function smash(o, sx, sy) {
  o.broken = true; anySmash = true;
  const def = o.def, glass = def.mat === 'glass';
  const ix = (sx - o.x) * P + o.ax, iy = (sy - o.y) / o.F0 * P + o.ay;
  const sw = o.sprite.width, sh = o.sprite.height;
  const Rm = Math.max(Math.hypot(ix, iy), Math.hypot(sw - ix, iy), Math.hypot(ix, sh - iy), Math.hypot(sw - ix, sh - iy));
  const seeds = glass
    ? radialSeeds(ix, iy, Rm, [.035, .09, .18, .32, .55, .9], [5, 9, 12, 14, 14, 12], .35)
    : radialSeeds(ix, iy, Rm, [.05, .12, .22, .36, .55, .8, 1.1], [3, 6, 8, 9, 10, 10, 10], .3);
  const { out, lost } = fracture(o.sprite, o.data, seeds, { minPx: 10 * P * P, glass, dark: def.dark, edge: def.edge });
  const groundY = o.y;
  for (const cell of out) {
    const wx = o.x + (cell.sx - o.ax) / P, wyS = o.y + (cell.sy - o.ay) / P * o.F0;
    let gy, z;
    if (o.flat) { gy = wyS; z = 2 * S; }
    else { gy = o.y + rand(-1, 1) * o.footR * K * .6; z = Math.max(0, gy - wyS); }
    const s = newShard(cell, def, wx, gy, z);
    s.F0 = o.F0; s.F = o.F0; s.Fr = K * rand(.86, 1.08);
    const dx = wx - sx, dy = wyS - sy, d = Math.hypot(dx, dy) || 1;
    const near = 1 / (1 + d / (70 * S));
    const sp = (glass ? rand(70, 280) : rand(55, 220)) * S * (.35 + near) * clamp(14 / Math.sqrt(s.area), .6, 1.5);
    s.vx = dx / d * sp + rand(-40, 40) * S;
    s.vy = (dy / d) * sp * .55 + rand(-35, 45) * S;
    s.vz = (o.flat ? rand(180, 420) : rand(80, 360)) * S * (.5 + near);
    s.va = rand(-9, 9) * (glass ? 1.3 : 1);
    s.vt = (Math.random() < .5 ? -1 : 1) * (o.flat ? (Math.random() < .25 ? rand(7, 12) : rand(.3, 3)) : rand(1, 7));
    s.flatRate = o.flat ? 99 : rand(1.4, 2.4);
    fly.push(s);
  }
  for (const l of lost) {
    const wx = o.x + (l.x - o.ax) / P, wy = o.y + (l.y - o.ay) / P * o.F0;
    const a = rand(TAU), sp = rand(80, 300) * S;
    parts.push({ t: 'crumb', x: wx, y: o.flat ? wy : groundY, z: o.flat ? 2 : Math.max(0, groundY - wy), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .5, vz: rand(100, 400) * S, s: clamp(Math.sqrt(l.px) / P, 1, 3) * S, col: l.col, a: rand(TAU) });
  }
  burst(sx, sy, def, o.flat ? 1 : 1.1, { x: sx, y: o.flat ? sy : groundY });
  juice(.075, .3, .5, 9, .02, sx, sy);
  sSmash(def.mat, sx, def.pitch);
  for (const n of objs) { if (n === o || n.broken) continue; const d = Math.hypot(n.x - o.x, (n.y - o.y) / K); if (d < 320 * S) { n.wobV += (n.x < o.x ? -1 : 1) * (1 - d / (320 * S)) * 1.1; if (d < 220 * S) sClink(n.mat, 30, .25 * (1 - d / (220 * S)), n.x, n.def.pitch, rand(.02, .09)); } }

}
function breakShard(s, sx, sy, power, list) {
  const T = Math.cos(s.tum) < 0 ? -1 : 1;
  let dx = sx - s.x, dy = (sy - (s.y - s.z)) / s.F;
  const c = Math.cos(-s.ang), sn = Math.sin(-s.ang);
  let lx = dx * c - dy * sn, ly = (dx * sn + dy * c) * T;
  let px = clamp(s.cx + lx * P, 0, s.img.width - 1), py = clamp(s.cy + ly * P, 0, s.img.height - 1);
  const pop = () => { s.ground = false; s.bounces = 1; s.vz = rand(120, 300) * S * power; const a = Math.atan2(s.y - sy, s.x - sx) + rand(-.6, .6); s.vx = Math.cos(a) * rand(20, 90) * S; s.vy = Math.sin(a) * rand(15, 60) * S; s.va = rand(-8, 8); s.vt = rand(-4, 4) * (Math.random() < .3 ? 1.5 : .3); s.age = 99; list.push(s); };
  if (s.area < 30 * S * S || fly.length + rest.length > 4200) { pop(); return 0; }
  const size = Math.sqrt(s.px);
  const n = clamp(Math.round(Math.sqrt(s.area) / (4.5 * S)) + 1, 2, 7);
  // if the blow landed off the piece, aim at its middle
  const data = s.img.getContext('2d').getImageData(0, 0, s.img.width, s.img.height).data;
  if (data[((py | 0) * s.img.width + (px | 0)) * 4 + 3] < 20) { px = s.cx; py = s.cy; }
  const seeds = [[px, py]], off = rand(TAU);
  for (let i = 0; i < n; i++) { const a = off + i * TAU / n + rand(-.3, .3), r = size * rand(.18, .55); seeds.push([px + Math.cos(a) * r, py + Math.sin(a) * r]); }
  const { out, lost } = fracture(s.img, data, seeds, { minPx: 5 * P * P, glass: s.mat === 'glass', dark: s.def.dark, edge: s.def.edge });
  if (out.length < 2) { pop(); return 0; }
  const ca = Math.cos(s.ang), sa = Math.sin(s.ang);
  const toWorld = (u, v) => { const lx = (u - s.cx) / P, ly = (v - s.cy) / P * T; return [s.x + lx * ca - ly * sa, s.y + (lx * sa + ly * ca) * s.F]; };
  for (const cell of out) {
    const [wx, wy] = toWorld(cell.sx, cell.sy);
    const ns = newShard(cell, s.def, wx, wy, s.z);
    ns.ang = s.ang; ns.tum = s.tum; ns.F0 = s.F; ns.F = s.F; ns.Fr = s.Fr; ns.flatRate = 99; ns.age = 1;
    const ddx = wx - sx, ddy = wy - sy, d = Math.hypot(ddx, ddy) || 1;
    const sp = rand(40, 170) * S * power;
    ns.vx = ddx / d * sp; ns.vy = ddy / d * sp * .6; ns.vz = rand(140, 420) * S * power;
    ns.va = rand(-9, 9); ns.vt = Math.random() < .15 ? rand(-9, 9) : rand(-1.2, 1.2); ns.bounces = 0;
    list.push(ns);
  }
  for (const l of lost) {
    const [wx, wy] = toWorld(l.x, l.y), a = rand(TAU);
    parts.push({ t: 'crumb', x: wx, y: wy, z: 1, vx: Math.cos(a) * 80 * S, vy: Math.sin(a) * 40 * S, vz: rand(100, 260) * S, s: clamp(Math.sqrt(l.px) / P, 1, 2.5) * S, col: l.col, a: rand(TAU) });
  }

}
function strike(x, y) {
  const sx = x - offX, sy = y - offY;
  const o = hitObject(sx, sy);
  if (o) { smash(o, sx, sy); return; }
  const HR = 15 * S;
  const cand = [];
  for (const s of fly) { const d = Math.hypot(s.x - sx, s.y - s.z - sy); if (d < s.rad * .85 + HR) cand.push([d, s, 0]); }
  for (const s of rest) { const d = Math.hypot(s.x - sx, s.y - sy); if (d < s.rad * .85 + HR) cand.push([d, s, 1]); }
  cand.sort((a, b) => a[0] - b[0]);
  const hit = cand.slice(0, 9);
  if (hit.length) {
    const born = []; let pieces = 0; const mats = {};
    const hitSet = new Set(hit.map(h => h[1]));
    for (const [, s] of hit) { mats[s.mat] = s; pieces += breakShard(s, sx, sy, 1, born); }
    fly = fly.filter(s => !hitSet.has(s)); rest = rest.filter(s => !hitSet.has(s));
    for (const s of born) { if (!s.comp) ensureAux(s); s.comp = null; fly.push(s); }
    groundDirty = true;
    // the shock nudges neighbours
    const R2 = 70 * S;
    rest = rest.filter(s => {
      const d = Math.hypot(s.x - sx, s.y - sy);
      if (d < R2 && Math.random() < .8) { const a = Math.atan2(s.y - sy, s.x - sx); s.ground = false; s.bounces = 2; s.vz = rand(60, 200) * S * (1 - d / R2); s.vx = Math.cos(a) * rand(20, 80) * S; s.vy = Math.sin(a) * rand(10, 40) * S; s.va = rand(-5, 5); s.vt = rand(-.8, .8); s.age = 99; s.comp = null; fly.push(s); return false; }
      return true;
    });

    const glass = !!mats.glass && !mats.ceramic;

    parts.push({ t: 'ring', x: sx, y: sy, r0: 4 * S, r1: 80 * S, w: 2 * S, col: def.pal[0], life: 0, max: .4, flat: K });
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8 + rand(-.2, .2); parts.push({ t: 'streak', x: sx, y: sy, a, r0: rand(6, 14) * S, len: rand(20, 50) * S, w: rand(.8, 1.6) * S, col: pick(def.pal), life: 0, max: rand(.14, .24) }); }
    for (let i = 0; i < 30; i++) { const a = rand(TAU), sp = rand(60, 260) * S; parts.push({ t: 'mote', x: sx, y: sy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .7 - rand(0, 80) * S, swirl: rand(-2.5, 2.5), life: 0, max: rand(.7, 1.6), sz: rand(.7, 2) * S, col: pick(def.pal), ph: rand(TAU) }); }
    for (let i = 0; i < 8; i++) { const a = rand(TAU), sp = rand(40, 200) * S; parts.push({ t: 'crumb', x: sx, y: sy, z: 1, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .5, vz: rand(100, 380) * S, s: rand(.8, 2) * S, col: pick(def.pal.concat([def.edge])), a: rand(TAU) }); }
    if (glass) for (let i = 0; i < 6; i++) parts.push({ t: 'glint', x: sx + rand(-25, 25) * S, y: sy + rand(-18, 12) * S, life: -rand(0, .3), max: rand(.35, .7), sz: rand(3, 6) * S });
    else puff(sx, sy, 1);
    juice(.035, .55, .25, 3.5, .006, sx, sy);
    sCrunch(glass ? 'glass' : 'ceramic', sx, pieces, def.pitch);
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (e) { }
    return;
  }
  // bare table
  parts.push({ t: 'ring', x: sx, y: sy, r0: 4 * S, r1: 60 * S, w: 1.4 * S, col: '#b9b1a6', life: 0, max: .5, flat: K });
  puff(sx, sy, .7);

}

/* ------------------------------------------------------------ main loop */
const elCount = document.getElementById('count'), elN = document.getElementById('n'), elHint = document.getElementById('hint');
let lastCount = -1, smashes = 0, glintT = 0;
function noteSmash() { smashes++; if (smashes === 2) elHint.style.opacity = 0; elCount.style.opacity = 1; }
function resize() {
  const nw = innerWidth, nh = innerHeight;
  P = Math.min(2, window.devicePixelRatio || 1);
  W = nw; H = nh;
  cv.width = Math.round(W * P); cv.height = Math.round(H * P);
  groundC = mk(cv.width, cv.height); gctx = groundC.getContext('2d');
  const tall = W / H < .9;
  if (!anySmash || (tall ? 'tall' : 'wide') !== layoutKey && !fly.length && !rest.length) {
    buildObjects(!objs.length); buildHammer(); fly = []; rest = []; crumbs = []; parts = [];
  } else { offX = (W - sceneW0) / 2; offY = (H - sceneH0) / 2; }
  groundDirty = true;
}
let last = performance.now();
function frame(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  let ts = 1;
  if (freezeT > 0) { freezeT -= rdt; ts = .015; }
  else if (slowT > 0) { slowT -= rdt; const u = 1 - slowT / slowDur; ts = lerp(slowMin, 1, u * u); }
  const dt = rdt * ts;
  // objects
  for (const o of objs) {
    if (o.appear < 1) o.appear = Math.min(1, o.appear + rdt / .75);
    o.wobV += (-o.wob * 260 - o.wobV * 9) * dt; o.wob += o.wobV * dt;
  }
  // shards
  for (let i = fly.length - 1; i >= 0; i--) {
    const s = fly[i];
    if (stepShard(s, dt)) { fly.splice(i, 1); bake(s); rest.push(s); }
  }
  stepParts(dt, rdt);
  glintT -= rdt;
  if (glintT < 0 && rest.length) {
    glintT = rand(.12, .35);
    for (let k = 0; k < 6; k++) { const s = rest[(Math.random() * rest.length) | 0]; if (s.mat === 'glass' || Math.random() < .12) { parts.push({ t: 'glint', x: s.x + rand(-.5, .5) * s.rad, y: s.y + rand(-.3, .3) * s.rad, life: 0, max: rand(.5, 1), sz: rand(2.5, 5.5) * S }); break; } }
  }
  // hammer
  const prevAng = ham.ang;
  ham.ang = hammerAngle(rdt);
  if (prevAng > HIT + .001 && ham.ang <= HIT + .02 && ham.pending) { const p = ham.pending; ham.pending = null; strike(p.x, p.y); }
  if (ham.pending && ham.swingT > .08) { const p = ham.pending; ham.pending = null; strike(p.x, p.y); }
  ham.tilt += (clamp((ham.x - ham.lastX) * .004, -.18, .18) - ham.tilt) * Math.min(1, rdt * 10); ham.lastX = ham.x;
  if (ham.touch) { ham.hideT -= rdt; ham.vis = clamp(ham.hideT / .3, 0, 1); }

  if (groundDirty) redrawGround();
  render(ctx, true);
  const cnt = fly.length + rest.length;

}
function render(g, live) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, g.canvas.width, g.canvas.height);
  g.setTransform(P, 0, 0, P, 0, 0);
  g.save();
  if (live) {
    if (shakeA > .05) g.translate(rand(-1, 1) * shakeA, rand(-1, 1) * shakeA);
    if (zoomA > .0005) { g.translate(zoomX, zoomY); g.scale(1 + zoomA, 1 + zoomA); g.translate(-zoomX, -zoomY); }
  }
  g.translate(offX, offY);
  const vis = o => !o.broken && o.appear > 0;
  for (const o of objs) if (vis(o)) { g.globalAlpha = clamp(o.appear * 1.4, 0, 1); g.drawImage(o.shadow.c, o.x - o.shadow.ox, o.y - o.shadow.oy, o.shadow.c.width / P, o.shadow.c.height / P); }
  g.globalAlpha = 1;
  for (const o of objs) if (vis(o) && o.flat) drawObj(g, o);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  if (live && (shakeA > .05 || zoomA > .0005)) { g.setTransform(P, 0, 0, P, 0, 0); if (shakeA > .05) g.translate(rand(-1, 1) * shakeA * .5, rand(-1, 1) * shakeA * .5); g.drawImage(groundC, 0, 0, W, H); }

  const standing = objs.filter(o => vis(o) && !o.flat).sort((a, b) => a.y - b.y);
  for (const o of standing) drawObj(g, o);
  for (const s of fly) drawShard(g, s);
  if (live) drawParts(g);
  g.restore();
  if (live) { g.setTransform(P, 0, 0, P, 0, 0); drawHammer(g); }
}
function drawObj(g, o) {
  const a = clamp(o.appear, 0, 1);
  g.save(); g.globalAlpha = clamp(a * 1.4, 0, 1);
  g.translate(o.x, o.y - (1 - easeOut(a)) * 16 * S);
  if (o.wob) g.rotate(o.wob * .06);
  if (o.flat) { g.save(); g.translate(0, 3.2 * S); g.scale(1, K); g.drawImage(o.side, -o.ax / P, -o.ay / P, o.side.width / P, o.side.height / P); g.restore(); g.scale(1, K); }

/* ---------------------------------------------------------------- input */
function overUI(e) { return e.target !== cv; }
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  auInit();
  ham.touch = e.pointerType !== 'mouse';
  ham.x = e.clientX; ham.y = e.clientY; ham.vis = 1; ham.hideT = .9;
  if (ham.pending) strike(ham.pending.x, ham.pending.y);
  ham.a0 = ham.ang; ham.swingT = 0; ham.pending = { x: e.clientX, y: e.clientY };
});
addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  ham.touch = false;
  if (overUI(e)) { ham.vis = 0; return; }
  ham.x = e.clientX; ham.y = e.clientY; ham.vis = 1;
});
document.addEventListener('mouseleave', () => { if (!ham.touch) ham.vis = 0; });
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 120); });
document.getElementById('sound').addEventListener('click', e => { AU.on = !AU.on; e.currentTarget.setAttribute('aria-pressed', AU.on); auInit(); });
document.getElementById('reset').addEventListener('click', () => {
  anySmash = false; smashes = 0; fly = []; rest = []; crumbs = []; parts = [];
  buildObjects(true); groundDirty = true; elCount.style.opacity = 0; elHint.style.opacity = 1;
});
document.getElementById('keep').addEventListener('click', () => {
  const c = mk(W * P, H * P), g = c.getContext('2d');
  if (groundDirty) redrawGround();
  render(g, false);
  c.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'still-life-broken.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, 'image/png');
});
window.__smash = { strike: (x, y) => strike(x, y), state: () => ({ objs: objs.map(o => [o.kind, Math.round(o.x), Math.round(o.y), o.broken]), fly: fly.length, rest: rest.length, S }) };
if (matchMedia('(hover: none)').matches) elHint.textContent = 'Tap to break. Tap the pieces to break them smaller.';
resize();
requestAnimationFrame(frame);
</script>
